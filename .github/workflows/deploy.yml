name: Deploy to AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: joblens-test
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Report non-secret OIDC identity claims
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')"
          TOKEN="$token" python - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({key: claims.get(key) for key in ("sub", "aud", "ref", "event_name", "job_workflow_ref")}))
          PY

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish the immutable release image
        id: image
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          image_uri="$ECR_REPOSITORY_URI:$RELEASE_SHA"
          repository_name="${ECR_REPOSITORY_URI##*/}"
          if ! aws ecr describe-images --repository-name "$repository_name" --image-ids imageTag="$RELEASE_SHA" >/dev/null 2>&1; then
            docker build --build-arg DEPLOYMENT_VERSION="$RELEASE_SHA" -t "$image_uri" .
            docker push "$image_uri"
          fi
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Deploy through Systems Manager
        id: deploy
        continue-on-error: true
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          jq -n --arg command "sudo /usr/local/bin/deploy-joblens '$IMAGE_URI'" '{commands:[$command]}' > /tmp/joblens-command.json
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $IMAGE_URI" \
            --parameters file:///tmp/joblens-command.json \
            --query 'Command.CommandId' \
            --output text)"
          set +e
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          wait_status=$?
          set -e
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          exit "$wait_status"

      - name: Verify the public release
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            response="$(curl --fail --silent "$PUBLIC_URL/api/health" || true)"
            if jq -e --arg version "$RELEASE_SHA" '.status == "ok" and .version == $version' <<<"$response" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "The public endpoint did not report the expected release." >&2
          exit 1

      - name: Roll back after a public health failure
        if: steps.verify.outcome == 'failure'
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          jq -n '{commands:["sudo /usr/local/bin/rollback-joblens"]}' > /tmp/joblens-rollback.json
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Roll back JobLens after failed public health check" \
            --parameters file:///tmp/joblens-rollback.json \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          for _ in $(seq 1 30); do
            if curl --fail --silent "${{ vars.PUBLIC_URL }}/api/health" | jq -e '.status == "ok"' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Rollback completed on the instance, but the public endpoint is still unhealthy." >&2
          exit 1

      - name: Fail an unsuccessful release
        if: steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: exit 1
